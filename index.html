<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Fresher Bot - Live Feed & Controls</title>

  <!-- MediaPipe Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #050508; margin: 0; padding: 0;
      height: 100dvh; width: 100vw; font-family: monospace; overflow: hidden;
      position: relative;
    }
    
    /* Live Camera Screen */
    #webcam {
      width: 100vw; height: 100dvh;
      object-fit: cover;
      transform: scaleX(-1);
      position: absolute; top: 0; left: 0; z-index: 1;
    }

    /* Diagnostics Overlay */
    #diagnosticPanel {
      position: absolute; top: 12px; left: 12px; z-index: 10;
      background: rgba(5, 5, 8, 0.82);
      border: 1px solid #00f0ff; border-radius: 10px;
      padding: 10px 14px; color: #00f0ff;
      font-size: 11px; line-height: 1.5;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
      max-width: 220px;
    }

    .diag-title { font-weight: bold; font-size: 12px; color: #fff; margin-bottom: 4px; text-transform: uppercase; }
    .diag-val { color: #ff0077; font-weight: bold; }

    /* Control Panel */
    #centerControlPanel {
      position: absolute; top: 12px; right: 12px; z-index: 10;
      display: flex; flex-direction: column; gap: 8px; width: 140px;
    }

    button {
      padding: 10px; font-size: 11px; font-weight: bold;
      color: #000; background-color: #00f0ff;
      border: none; border-radius: 12px; cursor: pointer;
      box-shadow: 0 0 8px rgba(0,240,255,0.4);
    }
  </style>
</head>
<body>

  <!-- LIVE CAMERA FEED -->
  <video id="webcam" autoplay playsinline muted></video>

  <!-- DIAGNOSTIC OVERLAY -->
  <div id="diagnosticPanel">
    <div class="diag-title">🤖 Bot Diagnostics</div>
    <div>BLE: <span id="bleStatus" class="diag-val">Disconnected</span></div>
    <div>Mode: <span id="modeStatus" class="diag-val">GESTURE</span></div>
    <div>Command: <span id="cmdStatus" class="diag-val">STOP (S)</span></div>
    <div>Tracking: <span id="trackStatus" class="diag-val">Searching...</span></div>
  </div>

  <!-- CONTROLS -->
  <div id="centerControlPanel">
    <button onclick="connectBluetooth()">Connect ESP32 📶</button>
    <button onclick="toggleMode()" id="modeBtn">Mode: Gesture</button>
    <button onclick="triggerDance()" style="background-color: #ff0077; color: #fff;">Dance Routine 💃</button>
  </div>

  <script>
    let bluetoothDevice, txCharacteristic;
    let currentMode = 'GESTURE';
    let lastCmd = '';
    let isDancing = false;
    let isGreeting = false;
    let greetingCooldown = false;
    let isProcessingFrame = false;

    const bleStatus = document.getElementById('bleStatus');
    const modeStatus = document.getElementById('modeStatus');
    const cmdStatus = document.getElementById('cmdStatus');
    const trackStatus = document.getElementById('trackStatus');
    const videoElement = document.getElementById('webcam');

    async function connectBluetooth() {
      try {
        bluetoothDevice = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'Fresher_Bot_BT' }],
          optionalServices: ['49535343-fe7d-4ae5-8fa9-9fafd205e455']
        });
        const server = await bluetoothDevice.gatt.connect();
        const service = await server.getPrimaryService('49535343-fe7d-4ae5-8fa9-9fafd205e455');
        txCharacteristic = await service.getCharacteristic('49535343-1e4d-4bd9-ba61-23c647249616');
        bleStatus.innerText = "Connected";
        bleStatus.style.color = "#00ff66";
        speakGreeting("Connected!");
      } catch (e) {
        console.log(e);
        bleStatus.innerText = "Failed";
      }
    }

    function sendCommand(cmd) {
      if (isDancing || isGreeting) return;
      if (cmd !== lastCmd) {
        if (txCharacteristic) {
          let encoder = new TextEncoder();
          txCharacteristic.writeValue(encoder.encode(cmd)).catch(err => console.log(err));
        }
        cmdStatus.innerText = cmd;
        lastCmd = cmd;
      }
    }

    function sendDirectCommand(cmd) {
      if (txCharacteristic) {
        let encoder = new TextEncoder();
        txCharacteristic.writeValue(encoder.encode(cmd)).catch(err => console.log(err));
      }
      cmdStatus.innerText = cmd;
    }

    function speakGreeting(messageText) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(messageText);
        msg.rate = 1.0;
        msg.pitch = 1.1;
        window.speechSynthesis.speak(msg);
      }
    }

    function executeGreetingRoutine() {
      isGreeting = true;
      greetingCooldown = true;
      cmdStatus.innerText = "GREETING";
      
      sendDirectCommand('F');
      
      setTimeout(() => {
        sendDirectCommand('B');
        setTimeout(() => {
          sendDirectCommand('S');
          speakGreeting("Welcome to Fresher's Day!");
          
          setTimeout(() => {
            isGreeting = false;
          }, 2500);

          setTimeout(() => {
            greetingCooldown = false;
          }, 8000);
        }, 400);
      }, 400);
    }

    function triggerDance() {
      isDancing = true;
      cmdStatus.innerText = "DANCE";
      speakGreeting("Let's dance!");
      
      let moves = ['L', 'R', 'L', 'R', 'B', 'F', 'S'];
      let i = 0;
      let interval = setInterval(() => {
        if (i < moves.length) {
          sendDirectCommand(moves[i]);
          i++;
        } else {
          clearInterval(interval);
          isDancing = false;
        }
      }, 600);
    }

    function toggleMode() {
      if (currentMode === 'GESTURE') {
        currentMode = 'FOLLOWER';
        document.getElementById('modeBtn').innerText = "Mode: Follower";
        modeStatus.innerText = "FOLLOWER";
      } else {
        currentMode = 'GESTURE';
        document.getElementById('modeBtn').innerText = "Mode: Gesture";
        modeStatus.innerText = "GESTURE";
      }
      sendCommand('S');
    }

    // ORIGINAL WORKING HAND GESTURE CALLBACK
    function onHandResults(results) {
      if (currentMode !== 'GESTURE' || isDancing || isGreeting) return;

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];
        let openFingers = 0;
        
        if (landmarks[8].y < landmarks[6].y) openFingers++;
        if (landmarks[12].y < landmarks[10].y) openFingers++;
        if (landmarks[16].y < landmarks[14].y) openFingers++;
        if (landmarks[20].y < landmarks[18].y) openFingers++;

        trackStatus.innerText = openFingers + " Fingers";

        if (openFingers >= 4) sendCommand('F');
        else if (openFingers === 3) sendCommand('B');
        else if (openFingers === 2) sendCommand('R');
        else if (openFingers === 1) sendCommand('L');
        else sendCommand('S');
      } else {
        trackStatus.innerText = "No Hand";
        sendCommand('S');
      }
    }

    // HUMAN FOLLOWER FACE CALLBACK
    function onFaceResults(results) {
      if (isDancing) return;

      if (results.detections && results.detections.length > 0) {
        const detection = results.detections[0];
        // Mirror calculation to align with mirrored webcam
        const faceCenterX = 1.0 - detection.boundingBox.xCenter;

        if (currentMode === 'GESTURE' && !greetingCooldown && !isGreeting) {
          executeGreetingRoutine();
          return;
        }

        // Human Follower Logic
        if (currentMode === 'FOLLOWER' && !isGreeting) {
          trackStatus.innerText = "Tracking Face";
          
          if (faceCenterX < 0.38) {
            sendCommand('L'); // Turn Left to keep human centered
          } else if (faceCenterX > 0.62) {
            sendCommand('R'); // Turn Right to keep human centered
          } else {
            sendCommand('F'); // Human is centered, move Forward
          }
        }
      } else {
        if (currentMode === 'FOLLOWER' && !isGreeting) {
          trackStatus.innerText = "Searching Face";
          sendCommand('S');
        }
      }
    }

    // Initialize MediaPipe Models
    const hands = new Hands({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
    hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5 });
    hands.onResults(onHandResults);

    const faceDetection = new FaceDetection({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${f}` });
    faceDetection.setOptions({ modelSelection: 0, minDetectionConfidence: 0.5 });
    faceDetection.onResults(onFaceResults);

    // Initial Camera Stream Engine
    async function startCameraDirectly() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false
        });
        videoElement.srcObject = stream;
        await videoElement.play();

        async function processFrame() {
          if (videoElement.readyState === 4 && !isProcessingFrame) {
            isProcessingFrame = true;
            try {
              if (currentMode === 'GESTURE') {
                await faceDetection.send({ image: videoElement });
                await hands.send({ image: videoElement });
              } else if (currentMode === 'FOLLOWER') {
                await faceDetection.send({ image: videoElement });
              }
            } catch (err) {
              console.warn("Frame skipped:", err);
            } finally {
              isProcessingFrame = false;
            }
          }
          requestAnimationFrame(processFrame);
        }
        processFrame();
      } catch (err) {
        trackStatus.innerText = "Camera Error";
        console.error(err);
      }
    }

    window.onload = startCameraDirectly;
  </script>
</body>
</html>
