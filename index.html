<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fresher Bot - Deluxe AI Edition</title>
  
  <!-- MediaPipe AI Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>

  <style>
    body {
      background-color: #050508;
      margin: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: sans-serif;
    }

    .face {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }

    .eyebrows { display: flex; gap: 60px; }
    .eyebrow {
      width: 100px; height: 12px; background-color: #00f0ff;
      border-radius: 6px; transition: all 0.2s ease; box-shadow: 0 0 15px #00f0ff;
    }

    .eyes { display: flex; gap: 50px; }
    .eye {
      width: 130px; height: 170px; background-color: #00f0ff;
      border-radius: 65px; transition: all 0.15s ease; box-shadow: 0 0 25px #00f0ff;
      position: relative;
    }

    .pupil {
      width: 45px; height: 45px; background-color: #050508;
      border-radius: 50%; position: absolute; top: 62px; left: 42px;
      transition: all 0.15s ease;
    }

    #controls {
      position: absolute; bottom: 15px; display: flex; gap: 8px; z-index: 10; flex-wrap: wrap; justify-content: center;
    }

    button {
      padding: 10px 16px; font-size: 13px; font-weight: bold;
      color: #000; background-color: #00f0ff; border: none;
      border-radius: 20px; cursor: pointer;
    }

    #overlayText {
      position: absolute; top: 40px; color: #00f0ff; font-size: 24px; font-weight: bold;
      text-transform: uppercase; letter-spacing: 2px; text-align: center;
    }

    video { display: none; }
  </style>
</head>
<body>

  <div id="overlayText">Status: Ready</div>

  <div class="face">
    <div class="eyebrows">
      <div id="leftBrow" class="eyebrow"></div>
      <div id="rightBrow" class="eyebrow"></div>
    </div>
    <div class="eyes">
      <div id="leftEye" class="eye"><div id="leftPupil" class="pupil"></div></div>
      <div id="rightEye" class="eye"><div id="rightPupil" class="pupil"></div></div>
    </div>
  </div>

  <div id="controls">
    <button onclick="connectBluetooth()">Connect ESP32</button>
    <button onclick="toggleMode()" id="modeBtn">Mode: Gesture</button>
    <button onclick="triggerDance()">Dance Routine 💃</button>
  </div>

  <video id="webcam" autoplay playsinline></video>

  <script>
    let bluetoothDevice, txCharacteristic;
    let currentMode = 'GESTURE';
    let hasGreeted = false;
    let isDancing = false;
    let lastCmd = '';

    const leftEye = document.getElementById('leftEye');
    const rightEye = document.getElementById('rightEye');
    const leftPupil = document.getElementById('leftPupil');
    const rightPupil = document.getElementById('rightPupil');
    const leftBrow = document.getElementById('leftBrow');
    const rightBrow = document.getElementById('rightBrow');
    const overlayText = document.getElementById('overlayText');

    // 1. Bluetooth Connection
    async function connectBluetooth() {
      try {
        bluetoothDevice = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'Fresher_Bot_BT' }],
          optionalServices: ['49535343-fe7d-4ae5-8fa9-9fafd205e455']
        });
        const server = await bluetoothDevice.gatt.connect();
        const service = await server.getPrimaryService('49535343-fe7d-4ae5-8fa9-9fafd205e455');
        txCharacteristic = await service.getCharacteristic('49535343-1e4d-4bd9-ba61-23c647249616');
        speak("Bluetooth Connected!");
      } catch (e) { console.log(e); }
    }

    function sendCommand(cmd) {
      if (isDancing) return;
      if (cmd !== lastCmd) {
        if (txCharacteristic) {
          let encoder = new TextEncoder();
          txCharacteristic.writeValue(encoder.encode(cmd));
        }
        setExpression(cmd);
        lastCmd = cmd;
      }
    }

    // 2. Voice Feedback via Phone Speaker
    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        let utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
      }
    }

    function toggleMode() {
      if (currentMode === 'GESTURE') {
        currentMode = 'FOLLOWER';
        document.getElementById('modeBtn').innerText = "Mode: Follower";
        speak("Human Follower Mode");
      } else {
        currentMode = 'GESTURE';
        document.getElementById('modeBtn').innerText = "Mode: Gesture";
        speak("Gesture Control Mode");
      }
    }

    // 3. Feature: Party Dance Routine
    function triggerDance() {
      isDancing = true;
      overlayText.innerText = "PARTY TIME! 💃";
      speak("Let's dance freshers!");
      
      let moves = ['L', 'R', 'L', 'R', 'F', 'S'];
      let i = 0;
      let interval = setInterval(() => {
        if (i < moves.length) {
          if (txCharacteristic) {
            let encoder = new TextEncoder();
            txCharacteristic.writeValue(encoder.encode(moves[i]));
          }
          setExpression(moves[i]);
          i++;
        } else {
          clearInterval(interval);
          isDancing = false;
          overlayText.innerText = "Status: Ready";
        }
      }, 700);
    }

    // 4. Facial Expressions UI with Winking
    function setExpression(cmd) {
      leftEye.style.height = '170px'; rightEye.style.height = '170px';
      leftPupil.style.transform = 'none'; rightPupil.style.transform = 'none';
      leftBrow.style.transform = 'none'; rightBrow.style.transform = 'none';

      if (cmd === 'L') {
        overlayText.innerText = "Turning Left";
        leftPupil.style.transform = 'translateX(-25px)';
        rightPupil.style.transform = 'translateX(-25px)';
        leftBrow.style.transform = 'rotate(-10deg) translateY(-5px)';
      } else if (cmd === 'R') {
        overlayText.innerText = "Turning Right";
        leftPupil.style.transform = 'translateX(25px)';
        rightPupil.style.transform = 'translateX(25px)';
        rightBrow.style.transform = 'rotate(10deg) translateY(-5px)';
      } else if (cmd === 'F') {
        overlayText.innerText = "Moving Forward";
        leftEye.style.height = '140px'; rightEye.style.height = '140px';
        leftBrow.style.transform = 'translateY(-12px)'; rightBrow.style.transform = 'translateY(-12px)';
      } else { // STOP / Idle
        overlayText.innerText = "Idle";
        leftPupil.style.transform = 'translateY(10px)';
        rightPupil.style.transform = 'translateY(10px)';
      }
    }

    // Feature: Idle Blink Loop
    setInterval(() => {
      if (lastCmd === 'S' || lastCmd === '') {
        rightEye.style.height = '10px';
        setTimeout(() => { rightEye.style.height = '170px'; }, 200);
      }
    }, 4000);

    // 5. MediaPipe Processing
    const videoElement = document.getElementById('webcam');

    function onHandResults(results) {
      if (currentMode !== 'GESTURE' || isDancing) return;
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];
        let openFingers = 0;
        if (landmarks[8].y < landmarks[6].y) openFingers++;
        if (landmarks[12].y < landmarks[10].y) openFingers++;
        if (landmarks[16].y < landmarks[14].y) openFingers++;
        if (landmarks[20].y < landmarks[18].y) openFingers++;

        if (openFingers >= 4) sendCommand('F');
        else if (openFingers === 0) sendCommand('S');
        else if (openFingers === 1) sendCommand('L');
        else if (openFingers === 2) sendCommand('R');
      } else {
        sendCommand('S');
      }
    }

    function onFaceResults(results) {
      if (isDancing) return;
      if (results.detections && results.detections.length > 0) {
        const detection = results.detections[0];
        const faceCenterX = detection.boundingBox.xCenter;

        if (!hasGreeted) {
          speak("Welcome to Fresher's Day! Glad to see you!");
          hasGreeted = true;
          setTimeout(() => { hasGreeted = false; }, 10000);
        }

        if (currentMode === 'FOLLOWER') {
          if (faceCenterX < 0.38) sendCommand('L');
          else if (faceCenterX > 0.62) sendCommand('R');
          else sendCommand('F');
        }
      } else if (currentMode === 'FOLLOWER') {
        sendCommand('S');
      }
    }

    const hands = new Hands({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
    hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5 });
    hands.onResults(onHandResults);

    const faceDetection = new FaceDetection({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${f}` });
    faceDetection.setOptions({ modelSelection: 0, minDetectionConfidence: 0.5 });
    faceDetection.onResults(onFaceResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await faceDetection.send({ image: videoElement });
        await hands.send({ image: videoElement });
      },
      width: 640, height: 480
    });
    camera.start();
  </script>
</body>
</html>
