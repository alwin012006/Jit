<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Fresher Bot - Dance & Reverse Edition</title>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #050508; margin: 0; padding: 10px 15px;
      display: flex; justify-content: space-between; align-items: center;
      height: 100dvh; width: 100vw; font-family: sans-serif; overflow: hidden;
    }
    .eye-container { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; width: 28vw; }
    .eyebrow { width: 110px; height: 10px; background-color: #00f0ff; border-radius: 5px; box-shadow: 0 0 12px #00f0ff; }
    .eye { width: 125px; height: 155px; background-color: #00f0ff; border-radius: 65px; position: relative; box-shadow: 0 0 25px #00f0ff; transition: all 0.2s; }
    .pupil { width: 42px; height: 42px; background-color: #050508; border-radius: 50%; position: absolute; top: 56px; left: 41px; transition: all 0.2s; }
    #centerControlPanel { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; width: 38vw; z-index: 10; }
    #overlayText { color: #00f0ff; font-size: 15px; font-weight: bold; text-align: center; }
    #voiceStatus { color: #ff0077; font-size: 11px; font-weight: bold; text-align: center; }
    .btn-group { display: flex; flex-direction: column; gap: 6px; width: 100%; max-width: 170px; }
    button { padding: 7px; font-size: 11px; font-weight: bold; color: #000; background-color: #00f0ff; border: none; border-radius: 15px; cursor: pointer; }
    
    /* Dedicated Remote Control Modal Modal */
    #remoteModal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100dvh;
      background: rgba(5, 5, 8, 0.95);
      z-index: 999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }
    .dpad-grid {
      display: grid;
      grid-template-columns: repeat(3, 70px);
      grid-template-rows: repeat(3, 70px);
      gap: 10px;
    }
    .dpad-btn {
      font-size: 20px;
      font-weight: bold;
      border-radius: 15px;
      background-color: #1a1a2e;
      color: #00f0ff;
      border: 2px solid #00f0ff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
    }
    .dpad-btn:active {
      background-color: #00f0ff;
      color: #000;
    }
    .dpad-stop {
      background-color: #ff0077;
      color: #fff;
      border-color: #ff0077;
    }
    .close-remote-btn {
      padding: 10px 20px;
      background-color: #ff0077;
      color: white;
      font-size: 14px;
      border-radius: 20px;
      margin-top: 10px;
    }
    
    video { display: none; }
  </style>
</head>
<body>

  <div class="eye-container">
    <div id="leftBrow" class="eyebrow"></div>
    <div id="leftEye" class="eye"><div id="leftPupil" class="pupil"></div></div>
  </div>

  <div id="centerControlPanel">
    <div id="overlayText">Status: Disconnected</div>
    <div id="voiceStatus">Mic: Off</div>
    <div class="btn-group">
      <button onclick="connectBluetooth()">Connect ESP32 📶</button>
      <button onclick="startVoiceRecognition()" id="micBtn">Enable Voice 🎤</button>
      <button onclick="toggleMode()" id="modeBtn">Mode: Gesture</button>
      <button onclick="openRemoteModal()" style="background-color: #ffe600; color: #000;">Remote Drive 🎮</button>
      <button onclick="triggerDance()" style="background-color: #ff0077; color: #fff;">Dance Routine 💃</button>
    </div>
  </div>

  <!-- Fullscreen Remote Control Overlay -->
  <div id="remoteModal">
    <h3 style="color: #00f0ff; margin: 0;">Manual Controller</h3>
    <div class="dpad-grid">
      <div></div>
      <button class="dpad-btn" onclick="manualDrive('F')">▲</button>
      <div></div>
      <button class="dpad-btn" onclick="manualDrive('L')">◄</button>
      <button class="dpad-btn dpad-stop" onclick="manualDrive('S')">STOP</button>
      <button class="dpad-btn" onclick="manualDrive('R')">►</button>
      <div></div>
      <button class="dpad-btn" onclick="manualDrive('B')">▼</button>
      <div></div>
    </div>
    <button class="close-remote-btn" onclick="closeRemoteModal()">Close Controller ✖</button>
  </div>

  <div class="eye-container">
    <div id="rightBrow" class="eyebrow"></div>
    <div id="rightEye" class="eye"><div id="rightPupil" class="pupil"></div></div>
  </div>

  <video id="webcam" autoplay playsinline></video>

  <script>
    let bluetoothDevice, txCharacteristic;
    let currentMode = 'GESTURE'; // Options: 'GESTURE', 'FOLLOWER', 'REMOTE'
    let lastCmd = '';
    let isDancing = false;
    let voiceOverrideStop = false;

    const overlayText = document.getElementById('overlayText');
    const voiceStatus = document.getElementById('voiceStatus');
    const leftEye = document.getElementById('leftEye');
    const rightEye = document.getElementById('rightEye');
    const leftPupil = document.getElementById('leftPupil');
    const rightPupil = document.getElementById('rightPupil');
    const remoteModal = document.getElementById('remoteModal');

    async function connectBluetooth() {
      try {
        bluetoothDevice = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'Fresher_Bot_BT' }],
          optionalServices: ['49535343-fe7d-4ae5-8fa9-9fafd205e455']
        });
        const server = await bluetoothDevice.gatt.connect();
        const service = await server.getPrimaryService('49535343-fe7d-4ae5-8fa9-9fafd205e455');
        txCharacteristic = await service.getCharacteristic('49535343-1e4d-4bd9-ba61-23c647249616');
        overlayText.innerText = "Status: Connected!";
        speak("Connected!");
      } catch (e) {
        console.log(e);
        overlayText.innerText = "Connection Failed";
      }
    }

    function openRemoteModal() {
      currentMode = 'REMOTE';
      document.getElementById('modeBtn').innerText = "Mode: Remote";
      remoteModal.style.display = 'flex';
    }

    function closeRemoteModal() {
      remoteModal.style.display = 'none';
      manualDrive('S');
    }

    function sendCommand(cmd) {
      if (isDancing) return;
      if (cmd !== lastCmd) {
        if (txCharacteristic) {
          let encoder = new TextEncoder();
          txCharacteristic.writeValue(encoder.encode(cmd));
        }
        setExpression(cmd);
        lastCmd = cmd;
      }
    }

    function sendDirectCommand(cmd) {
      if (txCharacteristic) {
        let encoder = new TextEncoder();
        txCharacteristic.writeValue(encoder.encode(cmd));
      }
      setExpression(cmd);
    }

    function manualDrive(cmd) {
      voiceOverrideStop = false;
      sendCommand(cmd);
    }

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        let utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
      }
    }

    function triggerDance() {
      isDancing = true;
      overlayText.innerText = "PARTY TIME! 💃";
      speak("Let's dance freshers!");
      
      let moves = ['L', 'R', 'L', 'R', 'B', 'F', 'S'];
      let i = 0;
      let interval = setInterval(() => {
        if (i < moves.length) {
          sendDirectCommand(moves[i]);
          i++;
        } else {
          clearInterval(interval);
          isDancing = false;
          overlayText.innerText = "Status: Ready";
        }
      }, 600);
    }

    function startVoiceRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return alert("Speech API not supported.");

      const recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        voiceStatus.innerText = "Mic: Listening...";
        document.getElementById('micBtn').style.backgroundColor = "#ff0077";
      };

      recognition.onresult = (event) => {
        const lastIndex = event.results.length - 1;
        const text = event.results[lastIndex][0].transcript.toLowerCase().trim();
        voiceStatus.innerText = `Heard: "${text}"`;

        if (text.includes("stop") || text.includes("wait")) {
          voiceOverrideStop = true;
          sendCommand('S');
          setTimeout(() => { voiceOverrideStop = false; }, 3000);
        } else if (text.includes("forward") || text.includes("go")) {
          voiceOverrideStop = false;
          sendCommand('F');
        } else if (text.includes("back") || text.includes("reverse")) {
          voiceOverrideStop = false;
          sendCommand('B');
        } else if (text.includes("left")) {
          voiceOverrideStop = false;
          sendCommand('L');
        } else if (text.includes("right")) {
          voiceOverrideStop = false;
          sendCommand('R');
        } else if (text.includes("dance") || text.includes("party")) {
          triggerDance();
        } else if (text.includes("follow")) {
          voiceOverrideStop = false;
          currentMode = 'FOLLOWER';
          document.getElementById('modeBtn').innerText = "Mode: Follower";
        }
      };

      recognition.onend = () => { recognition.start(); };
      recognition.start();
    }

    function toggleMode() {
      voiceOverrideStop = false;
      if (currentMode === 'GESTURE') {
        currentMode = 'FOLLOWER';
        document.getElementById('modeBtn').innerText = "Mode: Follower";
      } else if (currentMode === 'FOLLOWER') {
        currentMode = 'REMOTE';
        document.getElementById('modeBtn').innerText = "Mode: Remote";
      } else {
        currentMode = 'GESTURE';
        document.getElementById('modeBtn').innerText = "Mode: Gesture";
      }
    }

    function setExpression(cmd) {
      leftEye.style.height = '155px'; rightEye.style.height = '155px';
      leftPupil.style.transform = 'none'; rightPupil.style.transform = 'none';

      if (cmd === 'L') {
        overlayText.innerText = "Turning Left";
        leftPupil.style.transform = 'translateX(-20px)';
        rightPupil.style.transform = 'translateX(-20px)';
      } else if (cmd === 'R') {
        overlayText.innerText = "Turning Right";
        leftPupil.style.transform = 'translateX(20px)';
        rightPupil.style.transform = 'translateX(20px)';
      } else if (cmd === 'F') {
        overlayText.innerText = "Moving Forward";
        leftEye.style.height = '125px'; rightEye.style.height = '125px';
      } else if (cmd === 'B') {
        overlayText.innerText = "Reversing Back";
        leftPupil.style.transform = 'translateY(-15px)';
        rightPupil.style.transform = 'translateY(-15px)';
      } else {
        overlayText.innerText = "Idle / Stop";
        leftPupil.style.transform = 'translateY(10px)';
        rightPupil.style.transform = 'translateY(10px)';
      }
    }

    const videoElement = document.getElementById('webcam');

    function onHandResults(results) {
      if (currentMode !== 'GESTURE' || isDancing || voiceOverrideStop) return;
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];
        let openFingers = 0;
        if (landmarks[8].y < landmarks[6].y) openFingers++;
        if (landmarks[12].y < landmarks[10].y) openFingers++;
        if (landmarks[16].y < landmarks[14].y) openFingers++;
        if (landmarks[20].y < landmarks[18].y) openFingers++;

        if (openFingers >= 4) sendCommand('F');
        else if (openFingers === 3) sendCommand('B');
        else if (openFingers === 2) sendCommand('R');
        else if (openFingers === 1) sendCommand('L');
        else sendCommand('S');
      } else {
        sendCommand('S');
      }
    }

    function onFaceResults(results) {
      if (currentMode !== 'FOLLOWER' || isDancing || voiceOverrideStop) return;
      if (results.detections && results.detections.length > 0) {
        const detection = results.detections[0];
        const faceCenterX = 1.0 - detection.boundingBox.xCenter;

        if (faceCenterX < 0.40) sendCommand('L');
        else if (faceCenterX > 0.60) sendCommand('R');
        else sendCommand('F');
      } else {
        sendCommand('S');
      }
    }

    const hands = new Hands({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
    hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5 });
    hands.onResults(onHandResults);

    const faceDetection = new FaceDetection({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${f}` });
    faceDetection.setOptions({ modelSelection: 0, minDetectionConfidence: 0.5 });
    faceDetection.onResults(onFaceResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        if (currentMode === 'GESTURE') await hands.send({ image: videoElement });
        if (currentMode === 'FOLLOWER') await faceDetection.send({ image: videoElement });
      },
      width: 640, height: 480
    });
    camera.start();
  </script>
</body>
</html>
