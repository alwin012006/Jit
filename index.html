<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Fresher Bot - Dual Eyes & Gesture Control</title>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #050508; margin: 0; padding: 10px 15px;
      display: flex; justify-content: space-between; align-items: center;
      height: 100dvh; width: 100vw; font-family: sans-serif; overflow: hidden;
    }
    .eye-container { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; width: 28vw; }
    .eyebrow { width: 110px; height: 10px; background-color: #00f0ff; border-radius: 5px; box-shadow: 0 0 12px #00f0ff; }
    .eye { width: 125px; height: 155px; background-color: #00f0ff; border-radius: 65px; position: relative; box-shadow: 0 0 25px #00f0ff; transition: all 0.2s; }
    .pupil { width: 42px; height: 42px; background-color: #050508; border-radius: 50%; position: absolute; top: 56px; left: 41px; transition: all 0.2s; }
    #centerControlPanel { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; width: 38vw; z-index: 10; }
    #overlayText { color: #00f0ff; font-size: 15px; font-weight: bold; text-align: center; }
    button { padding: 9px 16px; font-size: 11px; font-weight: bold; color: #000; background-color: #00f0ff; border: none; border-radius: 15px; cursor: pointer; box-shadow: 0 0 10px rgba(0, 240, 255, 0.4); }
    video { display: none; }
  </style>
</head>
<body>

  <!-- LEFT EYE -->
  <div class="eye-container">
    <div id="leftBrow" class="eyebrow"></div>
    <div id="leftEye" class="eye"><div id="leftPupil" class="pupil"></div></div>
  </div>

  <!-- CENTER PANEL (BLE CONNECT & STATUS ONLY) -->
  <div id="centerControlPanel">
    <div id="overlayText">Status: Disconnected</div>
    <button onclick="connectBluetooth()">Connect ESP32 📶</button>
  </div>

  <!-- RIGHT EYE -->
  <div class="eye-container">
    <div id="rightBrow" class="eyebrow"></div>
    <div id="rightEye" class="eye"><div id="rightPupil" class="pupil"></div></div>
  </div>

  <video id="webcam" autoplay playsinline></video>

  <script>
    let bluetoothDevice, txCharacteristic;
    let lastCmd = '';
    let greetingCooldown = false;

    const overlayText = document.getElementById('overlayText');
    const leftEye = document.getElementById('leftEye');
    const rightEye = document.getElementById('rightEye');
    const leftPupil = document.getElementById('leftPupil');
    const rightPupil = document.getElementById('rightPupil');
    const videoElement = document.getElementById('webcam');

    async function connectBluetooth() {
      try {
        bluetoothDevice = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'Fresher_Bot_BT' }],
          optionalServices: ['49535343-fe7d-4ae5-8fa9-9fafd205e455']
        });
        const server = await bluetoothDevice.gatt.connect();
        const service = await server.getPrimaryService('49535343-fe7d-4ae5-8fa9-9fafd205e455');
        txCharacteristic = await service.getCharacteristic('49535343-1e4d-4bd9-ba61-23c647249616');
        overlayText.innerText = "Status: Connected!";
        speak("Connected!");
      } catch (e) {
        console.log(e);
        overlayText.innerText = "Connection Failed";
      }
    }

    function sendCommand(cmd) {
      if (cmd !== lastCmd) {
        if (txCharacteristic) {
          let encoder = new TextEncoder();
          txCharacteristic.writeValue(encoder.encode(cmd)).catch(err => console.log(err));
        }
        setExpression(cmd);
        lastCmd = cmd;
      }
    }

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        let utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1.0;
        utterance.pitch = 1.1;
        window.speechSynthesis.speak(utterance);
      }
    }

    function setExpression(cmd) {
      leftEye.style.height = '155px'; rightEye.style.height = '155px';
      leftPupil.style.transform = 'none'; rightPupil.style.transform = 'none';

      if (cmd === 'L') {
        overlayText.innerText = "Turning Left";
        leftPupil.style.transform = 'translateX(-20px)';
        rightPupil.style.transform = 'translateX(-20px)';
      } else if (cmd === 'R') {
        overlayText.innerText = "Turning Right";
        leftPupil.style.transform = 'translateX(20px)';
        rightPupil.style.transform = 'translateX(20px)';
      } else if (cmd === 'F') {
        overlayText.innerText = "Moving Forward";
        leftEye.style.height = '125px'; rightEye.style.height = '125px';
      } else if (cmd === 'B') {
        overlayText.innerText = "Reversing Back";
        leftPupil.style.transform = 'translateY(-15px)';
        rightPupil.style.transform = 'translateY(-15px)';
      } else {
        overlayText.innerText = "Idle / Stop";
        leftPupil.style.transform = 'translateY(10px)';
        rightPupil.style.transform = 'translateY(10px)';
      }
    }

    // Hand Gesture Recognition Callback
    function onHandResults(results) {
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];
        let openFingers = 0;
        if (landmarks[8].y < landmarks[6].y) openFingers++;
        if (landmarks[12].y < landmarks[10].y) openFingers++;
        if (landmarks[16].y < landmarks[14].y) openFingers++;
        if (landmarks[20].y < landmarks[18].y) openFingers++;

        if (openFingers >= 4) sendCommand('F');
        else if (openFingers === 3) sendCommand('B');
        else if (openFingers === 2) sendCommand('R');
        else if (openFingers === 1) sendCommand('L');
        else sendCommand('S');
      } else {
        sendCommand('S');
      }
    }

    // Face Detection Visitor Greeting Callback
    function onFaceResults(results) {
      if (results.detections && results.detections.length > 0) {
        if (!greetingCooldown) {
          greetingCooldown = true;
          speak("Welcome to symposium!");
          
          // Cooldown for 8 seconds before triggering another greeting
          setTimeout(() => {
            greetingCooldown = false;
          }, 8000);
        }
      }
    }

    const hands = new Hands({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
    hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5 });
    hands.onResults(onHandResults);

    const faceDetection = new FaceDetection({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${f}` });
    faceDetection.setOptions({ modelSelection: 0, minDetectionConfidence: 0.5 });
    faceDetection.onResults(onFaceResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
        await faceDetection.send({ image: videoElement });
      },
      width: 640, height: 480
    });
    camera.start();
  </script>
</body>
</html>
